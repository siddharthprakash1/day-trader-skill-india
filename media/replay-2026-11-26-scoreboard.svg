<text x="474" y="21" fill="#7f8ea3" text-anchor="middle">day-trader-skill-india: scoreboard</text>
<text x="18" y="46" fill="#ffcb6b" font-weight="bold">REPLAY of Thu 26 Nov 2026 on real Yahoo 5-minute bars, run after the close. Practice trades only, not live.</text>
<text y="88" fill="#82aaff" font-weight="bold"># 5. After the close: score against what the price really did</text>
<text y="106"><tspan x="18.0" fill="#c792ea">$</tspan><tspan x="33.7" fill="#7fdbca" textLength="493.3" lengthAdjust="spacing">python trader-journal/journal.py score --now "2026-11-26 15:45"</tspan></text>
<text y="124" fill="#d6deeb"><tspan x="18.0" textLength="336.7" lengthAdjust="spacing">ANGELONE 2026-11-26 practice: bought 88 at </tspan><tspan x="354.7" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="362.5" textLength="172.3" lengthAdjust="spacing">357.10 at 09:35, stop </tspan><tspan x="534.8" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="542.6" textLength="117.5" lengthAdjust="spacing">351.42, target </tspan><tspan x="660.1" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="667.9" textLength="164.4" lengthAdjust="spacing">368.46, flat by 15:00</tspan></text>
<text y="142" fill="#ffcb6b"><tspan x="18.0" textLength="814.3" lengthAdjust="spacing">  FLAT, simulated: neither the stop nor the target by 15:00: out at the close of the last bar before it.</tspan></text>
<text y="160" fill="#d6deeb"><tspan x="18.0" textLength="70.5" lengthAdjust="spacing">  Out at </tspan><tspan x="88.5" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="96.3" textLength="180.1" lengthAdjust="spacing">359.75: +0.47R, gross +</tspan><tspan x="276.4" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="284.2" textLength="125.3" lengthAdjust="spacing">233.20, charges </tspan><tspan x="409.5" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="417.3" textLength="94.0" lengthAdjust="spacing">58.48, net +</tspan><tspan x="511.3" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="519.1" textLength="54.8" lengthAdjust="spacing">174.72.</tspan></text>
<text y="178" fill="#d6deeb"><tspan x="18.0" textLength="305.4" lengthAdjust="spacing">BHEL 2026-11-26 practice: bought 89 at </tspan><tspan x="323.4" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="331.2" textLength="172.3" lengthAdjust="spacing">417.20 at 09:35, stop </tspan><tspan x="503.5" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="511.3" textLength="117.5" lengthAdjust="spacing">415.00, target </tspan><tspan x="628.7" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="636.6" textLength="164.4" lengthAdjust="spacing">421.60, flat by 15:00</tspan></text>
<text y="196" fill="#addb67"><tspan x="18.0" textLength="673.4" lengthAdjust="spacing">  TARGET, simulated: the 10:40 bar reached the target before any bar touched the stop.</tspan></text>
<text y="214" fill="#d6deeb"><tspan x="18.0" textLength="70.5" lengthAdjust="spacing">  Out at </tspan><tspan x="88.5" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="96.3" textLength="180.1" lengthAdjust="spacing">421.60: +2.00R, gross +</tspan><tspan x="276.4" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="284.2" textLength="125.3" lengthAdjust="spacing">391.60, charges </tspan><tspan x="409.5" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="417.3" textLength="94.0" lengthAdjust="spacing">60.56, net +</tspan><tspan x="511.3" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="519.1" textLength="54.8" lengthAdjust="spacing">331.04.</tspan></text>
<text y="232" fill="#d6deeb"><tspan x="18.0" textLength="383.7" lengthAdjust="spacing">2 scored, 0 left open. Wrote trader/journal.json.</tspan></text>
<text y="250" fill="#7f8ea3"><tspan x="18.0" textLength="884.8" lengthAdjust="spacing">Simulated = what a stop and a target at those prices would have done on Yahoo's 5-minute bars; a real fill can be</tspan></text>
<text y="268" fill="#d6deeb"><tspan x="18.0" textLength="62.6" lengthAdjust="spacing">  worse.</tspan></text>
<text y="286" fill="#7f8ea3"><tspan x="18.0" textLength="689.0" lengthAdjust="spacing">Rates: Groww's pricing page (groww.in/pricing), read 2026-11-24, equity intraday on NSE.</tspan></text>
<text y="304" fill="#d6deeb"><tspan x="18.0" textLength="689.0" lengthAdjust="spacing">Next: journal.py report for the scoreboard. Education and tooling, not financial advice.</tspan></text>
<text y="322" fill="#d6deeb"></text>
<text y="340" fill="#82aaff" font-weight="bold"># 6. The scoreboard, after charges</text>
<text y="358"><tspan x="18.0" fill="#c792ea">$</tspan><tspan x="33.7" fill="#7fdbca" textLength="501.1" lengthAdjust="spacing">python trader-journal/journal.py report --now "2026-11-26 15:45"</tspan></text>
