<svg xmlns="http://www.w3.org/2000/svg" width="948" height="1120" viewBox="0 0 948 1120" role="img" aria-label="day-trader-skill-india: trade">
<title>day-trader-skill-india: trade</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:13px;white-space:pre}</style>
<rect width="948" height="1120" rx="10" fill="#0b1622"/>
<path d="M0 10a10 10 0 0 1 10-10h928a10 10 0 0 1 10 10v48H0z" fill="#13202f"/>
<circle cx="20" cy="16" r="5.5" fill="#ff5f57"/><circle cx="38" cy="16" r="5.5" fill="#febc2e"/><circle cx="56" cy="16" r="5.5" fill="#28c840"/>
<text x="474" y="21" fill="#7f8ea3" text-anchor="middle">day-trader-skill-india: trade</text>
<text x="18" y="46" fill="#ffcb6b" font-weight="bold">REPLAY of Thu 26 Nov 2026 on real Yahoo 5-minute bars, run after the close. Practice trades only, not live.</text>
<text y="88" fill="#82aaff" font-weight="bold"># 2. BHEL, the second hit in the order printed: entry and exit plan</text>
<text y="106"><tspan x="18.0" fill="#c792ea">$</tspan><tspan x="33.7" fill="#7fdbca" textLength="657.7" lengthAdjust="spacing">python trader-entry/entry.py check BHEL --setup orb --now "2026-11-26 09:37" --write</tspan></text>
<text y="124" fill="#addb67"><tspan x="18.0" textLength="164.4" lengthAdjust="spacing">TRIGGERED 9:35 AM at </tspan><tspan x="182.4" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="190.3" textLength="446.3" lengthAdjust="spacing">417.20: the 9:30 bar (bar 3) closed above the range high </tspan><tspan x="636.6" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="644.4" textLength="125.3" lengthAdjust="spacing">417.00 (+0.05%).</tspan></text>
<text y="142"><tspan x="18.0" fill="#c792ea">$</tspan><tspan x="33.7" fill="#7fdbca" textLength="305.4" lengthAdjust="spacing">python trader-exit/exit.py plan --write</tspan></text>
<text y="160" fill="#d6deeb"><tspan x="18.0" textLength="602.9" lengthAdjust="spacing">Exit plan: BHEL long, Thu 2026-11-26, opening-range breakout on 5-minute bars</tspan></text>
<text y="178" fill="#d6deeb"><tspan x="18.0" textLength="125.3" lengthAdjust="spacing">  Entry         </tspan><tspan x="143.3" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="151.1" textLength="195.8" lengthAdjust="spacing">417.20 at 9:35 AM (bar 3)</tspan></text>
<text y="196" fill="#d6deeb"><tspan x="18.0" textLength="125.3" lengthAdjust="spacing">  Stop          </tspan><tspan x="143.3" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="151.1" textLength="258.4" lengthAdjust="spacing">415.00  opening-range midpoint: (</tspan><tspan x="409.5" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="417.3" textLength="70.5" lengthAdjust="spacing">417.00 + </tspan><tspan x="487.8" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="495.6" textLength="109.6" lengthAdjust="spacing">413.00) / 2 = </tspan><tspan x="605.2" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="613.1" textLength="47.0" lengthAdjust="spacing">415.00</tspan></text>
<text y="214" fill="#d6deeb"><tspan x="18.0" textLength="125.3" lengthAdjust="spacing">  Target        </tspan><tspan x="143.3" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="151.1" textLength="242.7" lengthAdjust="spacing">421.60  2R (two times the risk)</tspan></text>
<text y="232" fill="#d6deeb"><tspan x="18.0" textLength="125.3" lengthAdjust="spacing">  Risk a share  </tspan><tspan x="143.3" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="151.1" textLength="195.8" lengthAdjust="spacing">2.20 (0.53% of the entry)</tspan></text>
<text y="250" fill="#d6deeb"><tspan x="18.0" textLength="148.8" lengthAdjust="spacing">  Reward:risk   2.0</tspan></text>
<text y="268" fill="#d6deeb"><tspan x="18.0" textLength="446.3" lengthAdjust="spacing">  Flat by       15:00 IST, win or lose: no overnight hold</tspan></text>
<text y="286" fill="#7f8ea3"><tspan x="18.0" textLength="673.4" lengthAdjust="spacing">Set before the entry. If price hits the stop, you are out; never move it further away.</tspan></text>
<text y="304" fill="#7f8ea3"><tspan x="18.0" textLength="587.2" lengthAdjust="spacing">A stop is a plan, not a guarantee: a gap or a fast market can fill past it.</tspan></text>
<text y="322" fill="#d6deeb"></text>
<text y="340" fill="#82aaff" font-weight="bold"># 3. Time Machine and position size</text>
<text y="358"><tspan x="18.0" fill="#c792ea">$</tspan><tspan x="33.7" fill="#7fdbca" textLength="602.9" lengthAdjust="spacing">python trader-timemachine/timemachine.py run --write --now "2026-11-26 09:37"</tspan></text>
<text y="376" fill="#d6deeb"><tspan x="18.0" textLength="180.1" lengthAdjust="spacing">  target first   36.9 %</tspan></text>
<text y="394" fill="#d6deeb"><tspan x="18.0" textLength="180.1" lengthAdjust="spacing">  stop first     61.7 %</tspan></text>
<text y="412" fill="#d6deeb"><tspan x="18.0" textLength="368.0" lengthAdjust="spacing">  neither        1.3 %    still open at 3:00 PM</tspan></text>
<text y="430" fill="#d6deeb"><tspan x="18.0" textLength="540.3" lengthAdjust="spacing">  green          37.8 %   target first, or above the entry at 3:00 PM</tspan></text>
<text y="448" fill="#d6deeb"><tspan x="18.0" textLength="877.0" lengthAdjust="spacing">History: the same rule (15-min opening range, stop at the opening-range midpoint, 2R target) on each of those 58</tspan></text>
<text y="466" fill="#d6deeb"><tspan x="18.0" textLength="626.4" lengthAdjust="spacing">  real sessions fired 34 times: 8 target, 13 stop, 13 neither. Average R +0.229.</tspan></text>
<text y="484" fill="#ffcb6b"><tspan x="18.0" textLength="877.0" lengthAdjust="spacing">Close to break-even: at 2R the target has to come first in 33 % of the replays that hit one side; it did in 37 %</tspan></text>
<text y="502" fill="#d6deeb"><tspan x="18.0" textLength="352.4" lengthAdjust="spacing">  (target first 36.9 % vs stop first 61.7 %).</tspan></text>
<text y="520"><tspan x="18.0" fill="#c792ea">$</tspan><tspan x="33.7" fill="#7fdbca" textLength="281.9" lengthAdjust="spacing">python trader-budget/size.py --write</tspan></text>
<text y="538" fill="#d6deeb"><tspan x="18.0" textLength="446.3" lengthAdjust="spacing">BHEL buy, opening-range breakout, entry 417.20 at 9:35 AM</tspan></text>
<text y="556" fill="#d6deeb"><tspan x="18.0" textLength="595.1" lengthAdjust="spacing">Stop 415.00: opening-range midpoint. Target 421.60: 2R (two times the risk).</tspan></text>
<text y="574" fill="#d6deeb"><tspan x="18.0" textLength="822.1" lengthAdjust="spacing">Sized at 417.20 (the plan's entry). Risk 2.20 a share (entry 417.20 minus stop 415.00). Reward:risk 2.00.</tspan></text>
<text y="592" fill="#d6deeb"><tspan x="18.0" textLength="352.4" lengthAdjust="spacing">Limits (whole shares; the smallest one wins):</tspan></text>
<text y="610" fill="#d6deeb"><tspan x="18.0" textLength="125.3" lengthAdjust="spacing">  max loss      </tspan><tspan x="143.3" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="151.1" textLength="657.7" lengthAdjust="spacing">500 max loss / 2.20 risk a share                                          227 shares</tspan></text>
<text y="628" fill="#d6deeb"><tspan x="18.0" textLength="180.1" lengthAdjust="spacing">  position cap  75% of </tspan><tspan x="198.1" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="205.9" textLength="70.5" lengthAdjust="spacing">50,000 = </tspan><tspan x="276.4" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="284.2" textLength="602.9" lengthAdjust="spacing">37,500 / 417.20                                           89 shares  &lt;- binds</tspan></text>
<text y="646" fill="#d6deeb"><tspan x="18.0" textLength="125.3" lengthAdjust="spacing">  max order     </tspan><tspan x="143.3" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="151.1" textLength="657.7" lengthAdjust="spacing">40,000 / 417.20                                                            95 shares</tspan></text>
<text y="664" fill="#d6deeb"><tspan x="18.0" textLength="180.1" lengthAdjust="spacing">  cash          budget </tspan><tspan x="198.1" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="205.9" textLength="133.1" lengthAdjust="spacing">50,000 minus the </tspan><tspan x="339.0" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="346.9" textLength="156.6" lengthAdjust="spacing">5,000 cash buffer = </tspan><tspan x="503.5" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="511.3" textLength="297.5" lengthAdjust="spacing">45,000 / 417.20             107 shares</tspan></text>
<text y="682" fill="#d6deeb"></text>
<text y="700" fill="#82aaff" font-weight="bold"># 4. Risk check, then the practice journal</text>
<text y="718"><tspan x="18.0" fill="#c792ea">$</tspan><tspan x="33.7" fill="#7fdbca" textLength="407.2" lengthAdjust="spacing">python trader-risk/check.py --now "2026-11-26 09:37"</tspan></text>
<text y="736" fill="#addb67"><tspan x="18.0" textLength="266.2" lengthAdjust="spacing">PASS  #1 buy BHEL 89 shares, entry</tspan></text>
<text y="754" fill="#d6deeb"><tspan x="18.0" textLength="689.0" lengthAdjust="spacing">          entry 417.20 (the plan's entry), stop 415.00, target 421.60: risk 2.20 a share</tspan></text>
<text y="772" fill="#d6deeb"><tspan x="18.0" textLength="148.8" lengthAdjust="spacing">          max loss </tspan><tspan x="166.8" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="174.6" textLength="109.6" lengthAdjust="spacing">195.80 (limit </tspan><tspan x="284.2" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="292.1" textLength="234.9" lengthAdjust="spacing">500), reward:risk 2.00 (min 1)</tspan></text>
<text y="790" fill="#d6deeb"><tspan x="18.0" textLength="383.7" lengthAdjust="spacing">          before brokerage, STT and other charges</tspan></text>
<text y="808" fill="#d6deeb"><tspan x="18.0" textLength="344.5" lengthAdjust="spacing">          today before this: 0 of 3 trades, </tspan><tspan x="362.5" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="370.4" textLength="39.1" lengthAdjust="spacing">0 of </tspan><tspan x="409.5" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="417.3" textLength="125.3" lengthAdjust="spacing">1,500 daily loss</tspan></text>
<text y="826" fill="#d6deeb"></text>
<text y="844" fill="#d6deeb"><tspan x="18.0" textLength="375.8" lengthAdjust="spacing">Circuit breaker (practice trades): clear. Today </tspan><tspan x="393.8" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="401.7" textLength="133.1" lengthAdjust="spacing">0 after charges, </tspan><tspan x="534.8" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="542.6" textLength="125.3" lengthAdjust="spacing">1,000.16 of the </tspan><tspan x="667.9" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="675.7" textLength="219.2" lengthAdjust="spacing">1,500 daily loss limit left,</tspan></text>
<text y="862" fill="#d6deeb"><tspan x="18.0" textLength="321.0" lengthAdjust="spacing">  losing streak 0 of 3, 1 not scored yet.</tspan></text>
<text y="880" fill="#d6deeb"><tspan x="18.0" textLength="587.2" lengthAdjust="spacing">1 passed, 0 blocked at 2026-11-26 09:37 IST. Cash after the passed orders: </tspan><tspan x="605.2" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="613.1" textLength="203.6" lengthAdjust="spacing">12,869.20 (practice mode).</tspan></text>
<text y="898" fill="#addb67"><tspan x="18.0" textLength="877.0" lengthAdjust="spacing">Every order passed. trader-broker still asks you yes or no for each one, and you enter it in your own broker app</tspan></text>
<text y="916" fill="#d6deeb"><tspan x="18.0" textLength="86.1" lengthAdjust="spacing">  yourself.</tspan></text>
<text y="934" fill="#7f8ea3"><tspan x="18.0" textLength="344.5" lengthAdjust="spacing">Education and tooling, not financial advice.</tspan></text>
<text y="952"><tspan x="18.0" fill="#c792ea">$</tspan><tspan x="33.7" fill="#7fdbca" textLength="657.7" lengthAdjust="spacing">python trader-journal/journal.py add --practice --setup orb --now "2026-11-26 09:37"</tspan></text>
<text y="970" fill="#d6deeb"><tspan x="18.0" textLength="391.5" lengthAdjust="spacing">Journaled: BHEL 2026-11-26 practice: bought 89 at </tspan><tspan x="409.5" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="417.3" textLength="172.3" lengthAdjust="spacing">417.20 at 09:35, stop </tspan><tspan x="589.6" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="597.4" textLength="117.5" lengthAdjust="spacing">415.00, target </tspan><tspan x="714.9" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="722.7" textLength="172.3" lengthAdjust="spacing">421.60, flat by 15:00.</tspan></text>
<text y="988" fill="#d6deeb"><tspan x="18.0" textLength="446.3" lengthAdjust="spacing">Wrote trader/journal.json (2 trades). Nothing was placed.</tspan></text>
<text y="1006" fill="#d6deeb"><tspan x="18.0" textLength="571.6" lengthAdjust="spacing">Next: journal.py score once the session is over (after 15:30 India time).</tspan></text>
<text y="1024"><tspan x="18.0" fill="#c792ea">$</tspan><tspan x="33.7" fill="#7fdbca" textLength="368.0" lengthAdjust="spacing">python trader-journal/journal.py charges --plan</tspan></text>
<text y="1042" fill="#d6deeb"><tspan x="18.0" textLength="227.1" lengthAdjust="spacing">  If the target hits  gross +</tspan><tspan x="245.1" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="252.9" textLength="125.3" lengthAdjust="spacing">391.60, charges </tspan><tspan x="378.2" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="386.0" textLength="94.0" lengthAdjust="spacing">60.56, net +</tspan><tspan x="480.0" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="487.8" textLength="47.0" lengthAdjust="spacing">331.04</tspan></text>
<text y="1060" fill="#d6deeb"><tspan x="18.0" textLength="227.1" lengthAdjust="spacing">  If the stop hits    gross -</tspan><tspan x="245.1" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="252.9" textLength="125.3" lengthAdjust="spacing">195.80, charges </tspan><tspan x="378.2" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="386.0" textLength="94.0" lengthAdjust="spacing">60.38, net -</tspan><tspan x="480.0" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="487.8" textLength="47.0" lengthAdjust="spacing">256.18</tspan></text>
<text y="1078" fill="#d6deeb"><tspan x="18.0" textLength="524.6" lengthAdjust="spacing">  Reward : risk       2.00 before charges, 1.29 after charges (net </tspan><tspan x="542.6" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="550.4" textLength="101.8" lengthAdjust="spacing">331.04 : net </tspan><tspan x="652.2" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="660.1" textLength="54.8" lengthAdjust="spacing">256.18)</tspan></text>
<text y="1096" fill="#d6deeb"><tspan x="18.0" textLength="172.3" lengthAdjust="spacing">  Break-even          </tspan><tspan x="190.3" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="198.1" textLength="234.9" lengthAdjust="spacing">417.88: the price has to rise </tspan><tspan x="433.0" textLength="7.8" lengthAdjust="spacing">₹</tspan><tspan x="440.8" textLength="415.0" lengthAdjust="spacing">0.68 a share (0.16 %) before the trade makes anything</tspan></text>
</svg>
