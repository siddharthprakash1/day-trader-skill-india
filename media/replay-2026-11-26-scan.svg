<text x="18" y="46" fill="#ffcb6b" font-weight="bold">REPLAY of Thu 26 Nov 2026 on real Yahoo 5-minute bars, run after the close. Practice trades only, not live.</text>
<text y="88" fill="#82aaff" font-weight="bold"># 1. Scan the watchlist at 9:37 AM</text>
<text y="106"><tspan x="18.0" fill="#c792ea">$</tspan><tspan x="33.7" fill="#7fdbca" textLength="720.4" lengthAdjust="spacing">python trader-scanner/scan.py orb --watchlist trader/watchlist.json --now "2026-11-26 09:37"</tspan></text>
<text y="124" fill="#d6deeb"><tspan x="18.0" textLength="884.8" lengthAdjust="spacing">Opening-range breakout scan, Thu 2026-11-26 9:37 AM IST: 15-minute range (9:15 to 9:30 AM), 5-minute bars, Yahoo.</tspan></text>
